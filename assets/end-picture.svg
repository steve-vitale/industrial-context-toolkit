<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">What an engineering team ready for agents looks like</title>
<desc id="d">Six conditions: visible, tied to equipment, owned, kept current, connected and recorded. Below them, a path from one unit first to more units.</desc>
<rect width="1200" height="720" fill="#f6f8fa"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12293c">An engineering team ready for agents</text>
<text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506778">Six conditions. Each one has a test you can run on your own records.</text>
<rect x="40" y="110" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="40" y="110" width="370" height="46" rx="12" fill="#12696c"/>
<text x="56" y="141" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1  Visible</text>
<text x="56" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">Agents can reach the records</text>
<text x="56" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: the team's assistant can open</text>
<text x="56" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">the equipment list, work orders and drawings.</text>
<rect x="430" y="110" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="430" y="110" width="370" height="46" rx="12" fill="#12696c"/>
<text x="446" y="141" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2  Tied to equipment</text>
<text x="446" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">Every fact says which tag</text>
<text x="446" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: pick any fact and name the tag</text>
<text x="446" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">and the file and row it came from.</text>
<rect x="820" y="110" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="820" y="110" width="370" height="46" rx="12" fill="#12696c"/>
<text x="836" y="141" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3  Owned</text>
<text x="836" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">Each kind of fact has a named owner</text>
<text x="836" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: when two records disagree,</text>
<text x="836" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">you know who rules on it.</text>
<rect x="40" y="320" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="40" y="320" width="370" height="46" rx="12" fill="#12696c"/>
<text x="56" y="351" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4  Kept current</text>
<text x="56" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">Checks ride the closeouts</text>
<text x="56" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: a work order, drawing revision or MOC</text>
<text x="56" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">closes only after the records are checked.</text>
<rect x="430" y="320" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="430" y="320" width="370" height="46" rx="12" fill="#12696c"/>
<text x="446" y="351" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">5  Connected</text>
<text x="446" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">CMMS, historian and documents reachable</text>
<text x="446" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: the approved assistant can read them,</text>
<text x="446" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">by export or by connector.</text>
<rect x="820" y="320" width="370" height="190" rx="12" fill="#ffffff" stroke="#c9d6df"/>
<rect x="820" y="320" width="370" height="46" rx="12" fill="#12696c"/>
<text x="836" y="351" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">6  Recorded</text>
<text x="836" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c">Changes and reasons are kept</text>
<text x="836" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">Tell: you can see what changed, who ruled</text>
<text x="836" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#506778">and why, in a governed system of record.</text>
<text x="40" y="560" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#12293c">The path: one unit first</text>
<rect x="40" y="585" width="260" height="70" rx="35" fill="#e3f0ef" stroke="#12696c"/>
<text x="170" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c" text-anchor="middle">Audit one unit</text>
<path d="M302 620 L326 620" stroke="#12696c" stroke-width="3"/><path d="M320 613 L328 620 L320 627Z" fill="#12696c"/>
<rect x="330" y="585" width="260" height="70" rx="35" fill="#e3f0ef" stroke="#12696c"/>
<text x="460" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c" text-anchor="middle">Fix the top jobs</text>
<path d="M592 620 L616 620" stroke="#12696c" stroke-width="3"/><path d="M610 613 L618 620 L610 627Z" fill="#12696c"/>
<rect x="620" y="585" width="260" height="70" rx="35" fill="#e3f0ef" stroke="#12696c"/>
<text x="750" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c" text-anchor="middle">Set refresh checks</text>
<path d="M882 620 L906 620" stroke="#12696c" stroke-width="3"/><path d="M900 613 L908 620 L900 627Z" fill="#12696c"/>
<rect x="910" y="585" width="260" height="70" rx="35" fill="#e3f0ef" stroke="#12696c"/>
<text x="1040" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12293c" text-anchor="middle">Add the next unit</text>
<text x="40" y="695" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#506778">Tested on public and fictional inputs only. No plant acceptance or measured time saving.</text>
</svg>
