name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Networked setup is explicit: TE replay fixtures are ignored, not committed.
      # The fetcher accepts only the pinned SHA-256 bytes; failure stops the job.
      # --all adds the rest of the Braatz set (d00-d21), so the fault-detection results regenerate in CI.
      - name: Stage checksum-verified public TE fixtures
        run: python scripts/fetch_te_data.py --all
      # Second source for the topology check (revised TE code, Ricker's archive), pinned by SHA-256; report only.
      - name: Stage the revised TE code
        run: python scripts/verify_te_topology.py
      # Rebuild the gateway artifacts from source (the build reproduces the committed project ZIP byte for byte).
      - name: Generate current offline gateway artifacts
        run: python scripts/ignition/build_gateway.py --write-only
      - name: Reproduce the fictional manager handoff without optional packages
        run: python -S examples/manager-review/reproduce.py --out "$RUNNER_TEMP/manager-review"
      - name: Exercise agent self-service preparation and saved public drawing route
        run: python -S examples/agent-first-use/reproduce.py --out "$RUNNER_TEMP/agent-first-use"
      - name: Reproduce documented workflow entry points and failure controls
        run: python -S examples/agent-first-use/workflow-check/reproduce.py --out "$RUNNER_TEMP/workflow-check"
      - name: Exercise reusable maintenance intake across three revisions
        run: python -S examples/maintenance-intake/reproduce.py --out "$RUNNER_TEMP/maintenance-intake"
      - name: Exercise disappeared findings with changed comparison basis
        run: python -S examples/maintenance-intake/reproduce.py --basis-controls --out "$RUNNER_TEMP/maintenance-basis"
      - name: Explain two native CAD returns without waiving strict differences
        run: python examples/cad-handoff/receiving-review/reproduce.py --out "$RUNNER_TEMP/cad-receiving-review"
      - name: Rehearse drawing findings to an engineering receiving brief
        run: python examples/drawing-handoff/reproduce.py --out "$RUNNER_TEMP/drawing-handoff"
      - name: Rebuild frozen CAD candidates and re-score retained native returns offline
        run: python examples/cad-handoff/qualification/recheck.py --out "$RUNNER_TEMP/cad-qualification"
      - name: Check CAD evidence replay rejects altered records
        run: python examples/cad-handoff/qualification/check_controls.py
      - name: Recheck retained native layout losses and display diagnoses offline
        run: python examples/cad-handoff/qualification/check_diagnosis4.py
      - name: Recheck native record correspondence without waiving strict differences
        run: python examples/cad-handoff/qualification/check_correspondence5.py
      - name: Retain failed observer attempts and recheck installed capability evidence
        run: |
          python -S examples/cad-handoff/qualification/observer-transport-21/recheck_evidence.py
          python -S examples/cad-handoff/qualification/observer-transport-21/test_mailbox.py -v
          python -S examples/cad-handoff/qualification/observer-transport-21/test_evidence.py -v
          python -S examples/cad-handoff/qualification/observer-transport-21/recheck_bridge_development.py
          python -S examples/cad-handoff/qualification/observer-transport-21/recheck_async.py
          python -S examples/cad-handoff/qualification/observer-transport-21/test_bridge_evidence.py -v
          python -S examples/cad-handoff/qualification/observer-transport-21/test_native_io.py -v
          python -S examples/cad-handoff/qualification/observer-transport-21/test_ui_settle.py -v
          python -S examples/cad-handoff/qualification/observer-transport-21/recheck_bridge.py
          python -S examples/cad-handoff/qualification/observer-transport-21/test_bridge_receiving.py -v
      - name: Receive multi-asset native edit evidence and challenge lost fields and records
        run: |
          python examples/cad-handoff/qualification/full-ui-22/recheck.py
          python examples/cad-handoff/qualification/full-ui-22/test_contract.py -v
          python examples/cad-handoff/qualification/full-ui-22/test_receiving.py -v
          python examples/cad-handoff/qualification/full-ui-22/test_pixels.py -v
          python examples/cad-handoff/qualification/full-ui-22/test_evidence.py -v
      - name: Rebuild equipment-data sidecars and replay browser downloads without a CAD UI
        run: python examples/cad-handoff/qualification/check_exchange6.py
      - name: Verify frozen first-use session evidence without model calls
        run: python -S examples/agent-rehearsal/recheck.py
      - name: Check linked public-maintenance relationship controls without downloads
        run: python -S examples/public-data/round-4/check_controls.py
      # All tests run offline after setup; OPEN100 drawings/keys are committed.
      - name: Run full cached-data suite
        run: python scripts/run_tests.py --full
      - name: Re-score registered corpus and model comparisons offline
        run: python scripts/benchmark.py --registry benchmarks/registry.json
  snapshot-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional pinned MCP SDK
        run: pip install -r requirements-mcp.txt
      - name: Check public snapshot over local SDK, stdio and loopback HTTP
        run: python scripts/check_snapshot_mcp.py
      - name: Reproduce source revision and selected snapshot restart
        run: |
          python examples/pump-revision/reproduce.py --out "$RUNNER_TEMP/pump-revision"
          python examples/pump-revision/reproduce.py --out "$RUNNER_TEMP/pump-revision" --sdk-only
      - name: Reproduce owned team packets and complete selected readback
        run: |
          python examples/team-context/reproduce.py --out "$RUNNER_TEMP/team-context"
          python examples/team-context/reproduce.py --out "$RUNNER_TEMP/team-context" --sdk-only
